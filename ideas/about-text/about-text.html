<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwriting Hover Test</title>
<style>
  body {
    padding: 50px;
    background-color: #ffffff;
  }

  .handwriting-container {
    position: relative;
    display: inline-block;
  }

  .intro-img {
    display: block;
    max-width: 600px; /* Adjust size to fit the website layout */
    height: auto;
  }

/* HCITechLab transparent link area */
  .hcitechlab-link {
    position: absolute;
    cursor: pointer;

    /* Position over the "HCITechLab" handwriting */
    top: 14%;
    left: 21%;
    width: 37%;
    height: 9%;

    /* Always-visible affordance: a soft underline hinting it's a link */
    border-bottom: 2px solid rgba(0, 0, 0, 0.28);
    transition: transform 0.25s ease, border-color 0.25s ease;
  }

  /* Animated black underline that draws in on hover */
  .hcitechlab-link::before {
    content: "";
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 100%;
    height: 2px;
    background-color: #000;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.35s ease;
  }

  /* Hover state */
  .hcitechlab-link:hover {
    border-bottom-color: transparent;   /* hand off to the animated underline */
    transform: translateY(-2px);        /* subtle lift */
  }

  .hcitechlab-link:hover::before {
    transform: scaleX(1);               /* underline sweeps left -> right */
  }
</style>
</head>
<body>

<!-- Container -->
<div class="handwriting-container">

  <!-- ⚠️ The image filename must match the actual filename and be in the same folder -->
  <img src="text.png" alt="Intro text" class="intro-img">

  <!-- Click area -->
  <a href="https://hcitech.org/" target="_blank" rel="noopener noreferrer" class="hcitechlab-link" title="Go to HCITechLab"></a>

</div>

</body>
</html>
