<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Handwriting Hover Test</title>
<style>
  body {
    padding: 50px;
    background-color: #ffffff;
  }

  .handwriting-container {
    position: relative;
    display: inline-block;
  }

  .intro-img {
    display: block;
    max-width: 600px; /* Adjust size to fit the website layout */
    height: auto;
  }

  /* Shared style for every transparent link area */
  .contact-link {
    position: absolute;
    cursor: pointer;

    /* Always-visible affordance: a soft underline hinting it's a link */
    border-bottom: 2px solid rgba(0, 0, 0, 0.28);
    transition: transform 0.25s ease, border-color 0.25s ease;
  }

  /* Animated black underline that draws in on hover */
  .contact-link::before {
    content: "";
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 100%;
    height: 2px;
    background-color: #000;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 0.35s ease;
  }

  /* Hover state */
  .contact-link:hover {
    border-bottom-color: transparent;   /* hand off to the animated underline */
    transform: translateY(-2px);        /* subtle lift */
  }

  .contact-link:hover::before {
    transform: scaleX(1);               /* underline sweeps left -> right */
  }

  /* --- Position each area over its word on the second line --- */
  /* Line vertical band: top ~56%, height ~40% */

  /* "Linkedin" */
  .link-linkedin {
    top: 56%;
    left: -1%;
    width: 13%;
    height: 40%;
  }

  /* "Github" */
  .link-github {
    top: 56%;
    left: 14.5%;
    width: 10%;
    height: 40%;
  }

  /* "Google Scholar" */
  .link-scholar {
    top: 56%;
    left: 27%;
    width: 22%;
    height: 40%;
  }

  /* "X" */
  .link-x {
    top: 56%;
    left: 50.5%;
    width: 4.5%;
    height: 40%;
  }
</style>
</head>
<body>

<!-- Container -->
<div class="handwriting-container">

  <!-- ⚠️ The image filename must match the actual filename and be in the same folder -->
  <img src="text-contact.png" alt="Contact text" class="intro-img">

  <!-- Click areas -->
  <a href="https://www.linkedin.com/in/rachel-kim-925366323/" target="_blank" rel="noopener noreferrer" class="contact-link link-linkedin" title="LinkedIn"></a>
  <a href="https://github.com/RachelJKim" target="_blank" rel="noopener noreferrer" class="contact-link link-github" title="GitHub"></a>
  <a href="https://scholar.google.com/citations?user=MHj2MAoAAAAJ" target="_blank" rel="noopener noreferrer" class="contact-link link-scholar" title="Google Scholar"></a>
  <a href="https://x.com/Rachel_JKim" target="_blank" rel="noopener noreferrer" class="contact-link link-x" title="X"></a>

</div>

</body>
</html>
