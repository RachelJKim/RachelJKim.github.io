<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock pile — interactive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Dig through the rock pile</h1>
  <p class="sub">Move your cursor to push rocks aside, or click one to send it flying</p>

  <div id="stagewrap"><div id="stage"></div></div>

  <div class="bar">
    <button id="scatter">Scatter all</button>
    <button id="reset">Reset</button>
  </div>

  <div class="hint">123 rocks · each a real photo cutout placed from coordinate data</div>

  <script src="data.js"></script>
  <script src="intro-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
